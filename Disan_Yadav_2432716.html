<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="Disan_yadav_2432716.css">
</head>
<body>
    <div id="box">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false" id="changeCity">
            <button class="search-button" type="button" id="btn"> 
                <img src="https://static-00.iconduck.com/assets.00/search-icon-1024x1024-hd1pcvqu.png" class="material-icon">
            </button>
        </div>
        <div class="weather">
            <img src="" class="weather-icon" id="weather-icon">
            <p class="weather-condition" id="weather-condition"></p>
            <h1 class="city" id="cityN"></h1>
            <div>
                <p class="date-time" id="date"></p>
                <!-- https://cdn-icons-png.flaticon.com/512/1850/1850730.png -->
            </div>
        </div>
        <div class="details">
            <div class="data">
                <div>
                    <p class="humidity" id="humidity"></p>
                    <p>Humidity</p>
                    <img src="https://cdn-icons-png.flaticon.com/512/728/728093.png">
                </div>
            </div>
            <div class="data">
                <div>
                    <p class="wind" id="wind"></p>
                    <p class="wind-direction" id="wind-direction">213 deg</p>
                    <p>Wind Speed</p>
                    <img src="https://static-00.iconduck.com/assets.00/wind-icon-2048x1563-xzh65ux5.png">
                </div>
            </div>
            <div class="data">
                <div>
                    <p class="pressure" id="pressure"></p>
                    <p>Pressure</p>
                    <img src="https://cdn-icons-png.flaticon.com/512/1839/1839341.png">
                </div>
            </div>
            <div class="data">
                <div>
                    <p class="temp" id="temp"></p>
                    <p>Temp</p>
                    <img src="https://www.freeiconspng.com/uploads/temperature-icon-png-19.png">
                </div>
            </div>
        </div>
    </div>
    <script src="Disan_Yadav_2432716.js"></script>
</body>
</html>
